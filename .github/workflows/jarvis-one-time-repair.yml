name: Jarvis product repair runner

on:
  push:
    branches:
      - jarvis/repo-cleanup-2026-09-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis/repo-cleanup-2026-09-05
          fetch-depth: 0
      - name: Run stored repair program
        shell: bash
        run: |
          python - <<'RUNNER'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/jarvis-product-copy-repair.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in source or end not in source:
              raise SystemExit('Embedded Python program not found')
          program = textwrap.dedent(source.split(start, 1)[1].split(end, 1)[0])
          exec(compile(program, 'jarvis_product_repair.py', 'exec'), {'__name__': '__main__'})
          RUNNER
      - name: Commit repair and remove temporary runners
        shell: bash
        run: |
          rm -f .github/workflows/jarvis-one-time-repair.yml
          rm -f .github/workflows/jarvis-product-copy-repair.yml
          rm -f .github/workflows/jarvis-run-product-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align product pages with verified deliverables [jarvis-auto]"
          git push origin HEAD:jarvis/repo-cleanup-2026-09-05
