name: Jarvis one-time repository repair

on:
  push:
    branches:
      - jarvis/repo-cleanup-2026-09-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: jarvis/repo-cleanup-2026-09-05
          fetch-depth: 0

      - name: Repair locale metadata and validate repository
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:90]}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          en_title = 'CashFlowLab — AI Launch Systems for Predictable Cashflow'
          en_desc = 'Launch faster with ready-to-use kits, funnels and AI automations built to turn traffic into a predictable sales system.'
          de_title = 'CashFlowLab — KI-Launch-Systeme für planbaren Cashflow'
          de_desc = 'Starte schneller mit einsatzbereiten Kits, Funnels und KI-Automatisierungen für ein planbares Verkaufssystem.'

          patch('en/index.html', [
              ('<title>CashFlowLab — Sistemul AI care îți construiește cashflow predictibil</title>', f'<title>{en_title}</title>'),
              ('<meta property="og:url" content="https://cashflowlabai.com/" />', '<meta property="og:url" content="https://cashflowlabai.com/en/" />'),
              ('<meta property="og:title" content="CashFlowLab — Sistemul AI care îți construiește cashflow predictibil" />', f'<meta property="og:title" content="{en_title}" />'),
              ('<meta property="og:description" content="Kiturile, funnelul și automatizările AI care îți scot primul cashflow și îl transformă într-un sistem predictibil." />', f'<meta property="og:description" content="{en_desc}" />'),
              ('<meta name="twitter:title" content="CashFlowLab — Sistemul AI care îți construiește cashflow predictibil" />', f'<meta name="twitter:title" content="{en_title}" />'),
              ('<meta name="twitter:description" content="Kiturile, funnelul și automatizările AI care îți scot primul cashflow și îl transformă într-un sistem predictibil." />', f'<meta name="twitter:description" content="{en_desc}" />'),
          ])

          patch('de/index.html', [
              ('<title>CashFlowLab — Sistemul AI care îți construiește cashflow predictibil</title>', f'<title>{de_title}</title>'),
              ('<meta property="og:url" content="https://cashflowlabai.com/" />', '<meta property="og:url" content="https://cashflowlabai.com/de/" />'),
              ('<meta property="og:title" content="CashFlowLab — Sistemul AI care îți construiește cashflow predictibil" />', f'<meta property="og:title" content="{de_title}" />'),
              ('<meta property="og:description" content="Kiturile, funnelul și automatizările AI care îți scot primul cashflow și îl transformă într-un sistem predictibil." />', f'<meta property="og:description" content="{de_desc}" />'),
              ('<meta name="twitter:title" content="CashFlowLab — Sistemul AI care îți construiește cashflow predictibil" />', f'<meta name="twitter:title" content="{de_title}" />'),
              ('<meta name="twitter:description" content="Kiturile, funnelul și automatizările AI care îți scot primul cashflow și îl transformă într-un sistem predictibil." />', f'<meta name="twitter:description" content="{de_desc}" />'),
          ])

          x_default = '  <link rel="alternate" href="https://cashflowlabai.com/" hreflang="x-default" />'
          for filename in ('index.html', 'en/index.html', 'de/index.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if 'hreflang="x-default"' not in text:
                  anchor = '  <link rel="alternate" href="https://cashflowlabai.com/de/" hreflang="de" />'
                  if anchor not in text:
                      raise SystemExit(f'Missing hreflang anchor in {filename}')
                  text = text.replace(anchor, anchor + '\n' + x_default, 1)
                  p.write_text(text, encoding='utf-8')

          # Every tracked JSON file must be valid JSON.
          json_files = [p for p in root.rglob('*.json') if '.git' not in p.parts]
          for p in json_files:
              with p.open(encoding='utf-8') as f:
                  json.load(f)

          # Basic active-page sanity checks.
          active_html = [
              Path('index.html'), Path('en/index.html'), Path('de/index.html'),
              Path('free-kit/index.html'), Path('mini-kit/index.html'),
              Path('medium-kit/index.html'), Path('pro-kit/index.html'),
              Path('privacy.html'), Path('terms.html'), Path('imprint.html'),
          ]
          for p in active_html:
              if not p.exists():
                  raise SystemExit(f'Missing active page: {p}')
              text = p.read_text(encoding='utf-8')
              for marker in ('<html', '<head', '<body', '</html>'):
                  if marker not in text:
                      raise SystemExit(f'{p}: missing {marker}')

          # Local image/manifest references from active pages must resolve.
          asset_re = re.compile(r'(?:src|href)=["\'](/(?:Images|favicon)/[^"\'?#]+)')
          missing = []
          for p in active_html:
              text = p.read_text(encoding='utf-8')
              for ref in asset_re.findall(text):
                  if ref == '/favicon/favicon.png':
                      # Served by Netlify rewrite to /Images/logo-mark.png.
                      continue
                  target = Path(ref.lstrip('/'))
                  if not target.exists():
                      missing.append(f'{p}: {ref}')
          if missing:
              raise SystemExit('Missing local assets:\n' + '\n'.join(sorted(set(missing))))

          if Path('EOF').exists():
              raise SystemExit('Stray EOF file still exists')
          if list(root.rglob('*.new')):
              raise SystemExit('Temporary .new files still exist')

          print(f'Validated {len(json_files)} JSON files and {len(active_html)} active HTML pages.')
          PY

      - name: Commit one-time repairs
        shell: bash
        run: |
          rm -f .github/workflows/jarvis-one-time-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: repair locale metadata and validate static site [jarvis-auto]"
            git push origin HEAD:jarvis/repo-cleanup-2026-09-05
          fi
