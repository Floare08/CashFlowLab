name: Jarvis analytics consent patch

on:
  push:
    branches:
      - jarvis/repo-cleanup-2026-09-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis/repo-cleanup-2026-09-05
          fetch-depth: 0
      - name: Gate analytics behind consent
        run: python scripts/jarvis_analytics_consent_patch.py
      - name: Commit patch and remove one-time files
        shell: bash
        run: |
          rm -f scripts/jarvis_analytics_consent_patch.py
          rm -f .github/workflows/jarvis-one-time-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "privacy: gate analytics behind explicit consent [jarvis-auto]"
          git push origin HEAD:jarvis/repo-cleanup-2026-09-05
