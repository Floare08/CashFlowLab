name: Jarvis homepage localization pass

on:
  push:
    branches:
      - jarvis/repo-cleanup-2026-09-05

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis/repo-cleanup-2026-09-05
          fetch-depth: 0
      - name: Apply final RO EN DE localization polish
        run: python scripts/jarvis_homepage_localization.py
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Commit localization polish and remove one-time files
        shell: bash
        run: |
          rm -f scripts/jarvis_homepage_localization.py
          rm -f .github/workflows/jarvis-homepage-localization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finish RO EN DE canonical homepage localization [jarvis-auto]"
          git push origin HEAD:jarvis/repo-cleanup-2026-09-05
