              return text.replace(old, new, 1)

          def replace_pattern(text, pattern, replacement, label):
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one {label}, found {count}')
              return out

