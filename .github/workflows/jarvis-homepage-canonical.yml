name: Jarvis canonical homepage repair

on:
  push:
    branches:
      - jarvis/repo-cleanup-2026-09-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jarvis/repo-cleanup-2026-09-05
          fetch-depth: 0
      - name: Normalize only conflicting replacement targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/jarvis_homepage_canonical.py')
          s = p.read_text(encoding='utf-8')
          fixes = [
              ('<h4 style="margin-bottom:10px">Stil vizual</h4>', '<h4 style="margin-bottom:10px">Implementare pas cu pas</h4>'),
              ('<h4 style="margin-bottom:10px">Visual Style</h4>', '<h4 style="margin-bottom:10px">Step-by-Step Implementation</h4>'),
              ('<h4 style="margin-bottom:10px">Visueller Stil</h4>', '<h4 style="margin-bottom:10px">Schrittweise Umsetzung</h4>'),
          ]
          for old, new in fixes:
              if old not in s:
                  raise SystemExit(f'Expected conflicting token missing: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Align RO EN DE homepages to canonical products
        run: python scripts/jarvis_homepage_canonical.py
      - name: Validate repository after homepage repair
        run: python scripts/validate_repo.py
      - name: Commit canonical homepage repair and remove one-time files
        shell: bash
        run: |
          rm -f scripts/jarvis_homepage_canonical.py
          rm -f .github/workflows/jarvis-homepage-canonical.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align RO EN DE homepages with canonical 2026 products [jarvis-auto]"
          git push origin HEAD:jarvis/repo-cleanup-2026-09-05
