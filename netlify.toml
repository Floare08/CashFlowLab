[[redirects]]
  from = "/favicon/favicon.png"
  to = "/Images/logo-mark.png"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://connect.facebook.net https://static.hotjar.com https://js.stripe.com https://gumroad.com https://assets.mailerlite.com https://groot.mailerlite.com https://analytics.tiktok.com https://cdn-cgi.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://region1.google-analytics.com https://assets.mailerlite.com https://groot.mailerlite.com https://analytics.tiktok.com; frame-src https://js.stripe.com https://gumroad.com https://assets.mailerlite.com; form-action 'self' https://preview.mailerlite.io https://assets.mailerlite.com;"
